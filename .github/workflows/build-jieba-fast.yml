# 手动触发：在 Windows 上把 jieba-fast 0.53 编译成 Python 3.12 wheel，发布到 Release
name: Build jieba-fast wheel
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip download jieba_fast==0.53 --no-deps --no-binary :all: -d src
          python -m pip wheel src/jieba_fast-0.53.tar.gz --no-deps -w dist
          python -m pip install (Get-ChildItem dist/*.whl).FullName
          python -X utf8 -c "import jieba_fast; print(list(jieba_fast.cut('hello world test')))"
          dir dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete jieba-fast-wheel --yes -R ${{ github.repository }} 2>$null
          gh release create jieba-fast-wheel (Get-ChildItem dist/*.whl).FullName -R ${{ github.repository }} -t "jieba-fast 0.53 win_amd64 cp312" -n "Prebuilt for Amadeus install"
